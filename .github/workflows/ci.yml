name: CI

# Lints and tests on every push and pull request; the browser builds on
# main (and on demand), kept as an artifact.
#
# What keeps it quick:
# - Compiled dependencies are cached (Bevy is some 400 crates). Only main
#   writes the cache; pull requests read it.
# - Clippy only checks, and tests build with the `ci` profile: dependencies
#   at opt-level 1 and no debug info, a fraction of the dev profile's work.
# - No incremental compilation: it only helps a tree that is built twice.
# - A newer push to the same branch cancels the run before it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Warnings fail the build here, not at a desk.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries (ALSA for sound, Wayland and xkbcommon for the window)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libasound2-dev libwayland-dev libxkbcommon-dev
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci
      - name: Tests
        run: cargo test --workspace --locked --profile ci

  web:
    name: Browser builds
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: web
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The wasm-bindgen CLI must match Cargo.lock; the Makefile installs it
      # into .tools/, which is kept until the lock file changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build
        run: |
          for app in moon potsdam island; do
            make web APP=$app
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: dist
          retention-days: 14
