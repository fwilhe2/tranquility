<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{APP}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #note { position: fixed; inset: 0; display: grid; place-items: center;
            color: #ccc; font: 15px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="bevy" tabindex="0"></canvas>
  <div id="note">loading…</div>
  <script type="module">
    const note = document.getElementById('note');
    if (!navigator.gpu) {
      note.textContent = 'This build needs WebGPU (a current Chrome, Edge, Firefox or Safari).';
    } else {
      // Browsers keep sound off until the page has been clicked or a key
      // pressed: remember every audio context the app opens, and wake them
      // then.
      const contexts = [];
      const Context = window.AudioContext || window.webkitAudioContext;
      if (Context) {
        window.AudioContext = window.webkitAudioContext = new Proxy(Context, {
          construct(target, args) { const c = new target(...args); contexts.push(c); return c; },
        });
        const wake = () => contexts.forEach((c) => { if (c.state === 'suspended') c.resume(); });
        for (const event of ['pointerdown', 'keydown', 'touchend']) addEventListener(event, wake, true);
      }
      const { default: init } = await import('./app.js');
      note.remove();
      // Bevy hands control to the browser's event loop by throwing; that is
      // expected and not a failure.
      init().catch((e) => { if (!String(e).includes('Using exceptions for control flow')) throw e; });
    }
  </script>
</body>
</html>
