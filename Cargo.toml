[workspace]
resolver = "3"
members = ["crates/tranquility", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tranquility = { path = "crates/tranquility" }
# No audio or gamepad features: they would pull in alsa and libudev, and
# nothing here needs them yet.
bevy = { version = "0.20.0", default-features = false, features = [
    "default_app",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "std",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "keyboard",
    "mouse",
    "x11",
    "wayland",
] }
noise = "0.9.0"

# Our own code builds fast and stays debuggable; dependencies are optimised,
# otherwise terrain generation and rendering crawl in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The engine and the moon are mostly arithmetic run a hundred million times
# (noise, craters, meshing): unoptimised, the moon takes a minute to appear
# and a laptop's fan and clock give up meanwhile.
[profile.dev.package.tranquility]
opt-level = 3

[profile.dev.package.moon]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = true

# Bevy systems take their world access as parameters: many of them, with
# long query types.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
# Flat `[x, z, …]` rings read best as `chunks_exact(2)`.
chunks_exact_to_as_chunks = "allow"
